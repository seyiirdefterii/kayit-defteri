<!-- ================= REHBER ================= -->
<template id="tpl-rehber">
  <p class="note">Genel bilgidir, hukuki danışmanlık yerine geçmez. Kasım 2026 itibarıyla resmî metinler ve yargı kararlarından derlendi. Süreler hak düşürücü olabilir; işlem yapmadan önce bir avukata danış.</p>
  <details class="doc" open>
    <summary>Mobbing nedir?</summary>
    <div class="body">
      <p><b>Resmî tanım:</b> 2025/3 sayılı Cumhurbaşkanlığı Genelgesi psikolojik tacizi, çalışanların iş yerinde kasıtlı ve sistematik olarak belirli bir süre aşağılanması, küçümsenmesi, dışlanması, kişilik ve saygınlığının zedelenmesi, kötü muameleye ve yıldırmaya maruz bırakılması olarak tanımlar.</p>
      <p><b>Yargıtay'ın aradığı unsurlar:</b></p>
      <ul>
        <li>Belirli bir çalışanın <b>hedef alınması</b>,</li>
        <li>Davranışların uzun süre boyunca, belli aralıklarla <b>sistematik ve sürekli</b> tekrarlanması,</li>
        <li>Şeref, kişilik, yetenek gibi değerlere yönelik bir <b>saldırı</b> olması,</li>
        <li>Kişiyi zihinsel, ruhsal ya da bedensel olarak etkileyebilecek nitelikte olması.</li>
      </ul>
      <p><b>Bilimsel ölçüt:</b> Heinz Leymann'a göre davranışların <b>en az haftada bir</b> tekrarlanması ve <b>en az altı ay</b> sürmesi gerekir. Leymann 45 davranışı 5 grupta toplar; uygulamadaki gruplar bu sınıflamaya dayanır. Sistematiklik sayfası kayıtlarının bu ölçüte ne kadar yaklaştığını gösterir; bu bir hukuki değerlendirme değildir.</p>
      <p class="src">Kaynak: 2025/3 sayılı Genelge, RG 06.03.2025, sayı 32833 · Yargıtay 22. HD, E. 2014/3426, K. 2014/4165, T. 27.02.2014 · Leymann (1990, 1993).</p>
    </div>
  </details>
  <details class="doc">
    <summary>Mobbing sayılmayan durumlar</summary>
    <div class="body">
      <ul>
        <li><b>Tek seferlik ya da ara sıra yaşanan</b> kaba, nezaketsiz veya haksız davranışlar. Yargıtay, süreklilik göstermeyen münferit olayları mobbing saymamıştır.</li>
        <li><b>Sistematik olmayan baskı:</b> Davranış haksız olsa bile belli aralıklarla tekrarlanmıyorsa mobbing unsuru eksik kalabilir; başka haklar doğabilir.</li>
        <li><b>Herkese eşit uygulanan, hukuka uygun iş talimatları</b> ve işin gereği olan olağan eleştiriler.</li>
        <li><b>Eşit güçteki taraflar arasındaki karşılıklı tartışmalar.</b></li>
      </ul>
      <div class="info">Bu yüzden her olayı kaydetmek önemlidir: tek tek küçük görünen olaylar tarih sırasıyla yan yana gelince süreklilik ortaya çıkar.</div>
      <p class="src">Kaynak: Yargıtay 22. HD, E. 2014/3426, K. 2014/4165 · yargı kararları ve öğretide genel kabul gören değerlendirmeler.</p>
    </div>
  </details>
  <details class="doc">
    <summary>Kayıtlarının delil değeri</summary>
    <div class="body">
      <ul>
        <li><b>Mobbing her türlü delille ispat edilebilir.</b> Bir hukuki işlem değil, yaşanmış olaylar bütünü olduğu için tanık, belge, yazışma ve kayıtlar birlikte değerlendirilir. Yargıtay mobbingde kesin ispat yerine güçlü belirtileri (yaklaşık ispat) yeterli görmektedir.</li>
        <li><b>Kendi tuttuğun kayıt</b> tek başına kesin delil değildir; hâkimin takdirine bağlı bir belgedir. Değerini artıran şey <b>olay gününde tutulmuş olması, ayrıntılı ve tutarlı olması, tanık ve belgelerle desteklenmesidir.</b></li>
        <li><b>Kendine ya da güvendiğin birine e-posta:</b> Elektronik veriler Hukuk Muhakemeleri Kanunu'na göre belge sayılır (HMK md. 199). Güvenli elektronik imza taşımayan e-posta kesin delil değildir, takdiri delildir; ancak gönderim tarihi e-posta sağlayıcısının sunucu kayıtlarında yer aldığı için "bu kayıt o tarihte vardı" iddiasını güçlendirir.</li>
        <li><b>KEP (Kayıtlı Elektronik Posta):</b> Gönderim ve teslim zamanını zaman damgalı kayıtla belgeler. İspat gücü sıradan e-postadan yüksektir. PTT ya da yetkili KEP hizmet sağlayıcılarından ücretli adres alınır.</li>
        <li><b>Güvenli elektronik imzalı belgeler</b> senet hükmündedir (HMK md. 205/2).</li>
      </ul>
      <div class="warn"><b>Gizli ses kaydı:</b> Kişiler arasındaki konuşmayı izinsiz kayda almak TCK md. 133 kapsamında suç oluşturabilir. Yargıtay bazı kararlarında, başka türlü ispat imkânı olmayan, ani gelişen durumlarda yapılan kaydı hukuka uygun saymıştır. Kayıt almadan önce mutlaka avukata danış.</div>
      <p class="src">Kaynak: 6100 s. HMK md. 199, 202, 205 · 5070 s. Elektronik İmza Kanunu · TCK md. 133 · e-posta ve KEP'in ispat gücüne ilişkin öğreti.</p>
    </div>
  </details>
  <details class="doc" data-sek="kamu">
    <summary>Kamu çalışanı: başvuru yolları ve süreler</summary>
    <div class="body">
      <ol>
        <li><b>Kurum içi şikâyet:</b> Devlet memurları şikâyetlerini <span class="law">657 s.K. md. 21</span> uyarınca amir sırasıyla yapar. Devlet Memurlarının Şikâyet ve Müracaatları Hakkında Yönetmelik'e göre şikâyet hakkında <b>30 gün</b> içinde karar verilir; karara karşı tebliğden itibaren <b>10 gün</b> içinde üst makama itiraz edilebilir. Dilekçeni evrak kaydına sokup <b>sayı ve tarih</b> al.</li>
        <li><b>Dilekçeye cevap:</b> <span class="law">3071 s.K. md. 7</span> uyarınca dilekçelere en geç <b>30 gün</b> içinde cevap verilir.</li>
        <li><b>Zımni ret ve dava:</b> İdareye yapılan başvuruya <b>30 gün</b> içinde cevap verilmezse istek reddedilmiş sayılır ve bu sürenin bitiminden itibaren <b>60 gün</b> içinde dava açılabilir <span class="law">İYUK md. 10</span>. Açık ret cevabında dava süresi tebliğden itibaren <b>60 gündür</b> <span class="law">İYUK md. 7</span>.</li>
        <li><b>Disiplin cezasına itiraz:</b> Kararın tebliğinden itibaren <b>7 gün</b> içinde itiraz edilir; itiraz mercii 30 gün içinde karar verir. Süresinde itiraz edilmeyen cezalar kesinleşir <span class="law">657 s.K. md. 135</span>. İptal davası için genel süre 60 gündür.</li>
        <li><b>Bilgi edinme:</b> Görevlendirme yazıları, nöbet listeleri gibi belgeleri <span class="law">4982 s.K.</span> ile isteyebilirsin. Kurum <b>15 iş günü</b> içinde cevap verir (zorunlu hâllerde 30 iş günü). Ret kararına karşı tebliğden itibaren <b>15 gün</b> içinde Bilgi Edinme Değerlendirme Kurulu'na itiraz edilebilir <span class="law">md. 11, 13</span>.</li>
        <li><b>Kamu Denetçiliği Kurumu (Ombudsman):</b> Önce idareye başvurman gerekir. İdare <b>60 gün</b> içinde cevap vermezse bu sürenin bitiminden, cevap verirse tebliğden itibaren <b>6 ay</b> içinde başvurulabilir. Ücretsizdir, gizli tutulması istenebilir; dava açma süresi içinde yapılan başvuru işlemeye başlamış dava süresini durdurur <span class="law">6328 s.K. md. 17</span>.</li>
        <li><b>Kamu Görevlileri Etik Kurulu:</b> Etik davranış ilkelerinin ihlali için başvurulabilir <span class="law">5176 s.K.</span>.</li>
        <li><b>Ceza yolu:</b> Davranış aynı zamanda suç oluşturuyorsa savcılığa şikâyet edilebilir. Memurlar hakkında görevle ilgili suçlarda soruşturma izni gerekir <span class="law">4483 s.K.</span>.</li>
      </ol>
      <div class="info"><b>Sürelerin hesabı:</b> Süre, tebliğ gününden sonraki gün başlar. Son gün resmî tatile denk gelirse ilk iş gününe uzar. İdari yargıda adli tatile (20 Temmuz–31 Ağustos) denk gelen dava süreleri tatilin bitiminden itibaren 7 gün uzar <span class="law">İYUK md. 8, 61</span>. Süreler sayfası bunları hesaba katar ama son kontrolü avukatınla yap.</div>
      <p class="src">Kaynak: 657, 3071, 4483, 4982, 5176, 6328 ve 2577 sayılı Kanunlar · İYUK md. 10'daki 30 günlük süre 7331 s.K. ile (RG 14.07.2021) · Şikâyet ve Müracaatlar Yönetmeliği.</p>
    </div>
  </details>
  <details class="doc" data-sek="ozel">
    <summary>Özel sektör çalışanı: haklar ve süreler</summary>
    <div class="body">
      <ol>
        <li><b>İşverenin yükümlülüğü:</b> <span class="law">TBK md. 417</span> uyarınca işveren, işçilerin psikolojik tacize uğramamaları ve uğrayanların daha fazla zarar görmemeleri için gerekli önlemleri almakla yükümlüdür.</li>
        <li><b>Yazılı bildirim:</b> Durumu işverene ya da insan kaynaklarına yazılı (e-posta, KEP veya noter) bildir ve kopyasını sakla.</li>
        <li><b>Haklı nedenle fesih:</b> Mobbing <span class="law">İş K. md. 24/II</span> kapsamında haklı fesih sebebi olabilir. Fesih, olayı öğrenmeden itibaren <b>6 iş günü</b> ve her hâlde <b>1 yıl</b> içinde yapılmalıdır <span class="law">İş K. md. 26</span>. Süreklilik gösteren davranışlarda sürenin son olaydan başladığı kabul edilir. En az 1 yıl kıdemin varsa kıdem tazminatı istenebilir.</li>
        <li><b>Düz istifa etme:</b> Gerekçesiz istifada kıdem tazminatı hakkını kaybedebilirsin. Ayrılmadan önce mutlaka avukata danış.</li>
        <li><b>Zorunlu arabuluculuk:</b> İşçilik alacakları ve tazminat davalarında dava açmadan önce arabulucuya başvurmak dava şartıdır <span class="law">7036 s.K. md. 3</span>.</li>
        <li><b>Bakanlığa şikâyet:</b> ALO 170 ya da CİMER üzerinden Çalışma ve Sosyal Güvenlik Bakanlığı'na başvurabilirsin.</li>
      </ol>
      <p class="src">Kaynak: 6098 s. TBK md. 417 · 4857 s. İş Kanunu md. 24, 26 · 7036 s. İş Mahkemeleri Kanunu md. 3 · 2025/3 sayılı Genelge.</p>
    </div>
  </details>
  <details class="doc">
    <summary>Başvurabileceğin kurumlar</summary>
    <div class="body">
      <ul>
        <li><b>Çalıştığın kurum</b> (ilgili mevzuata göre)</li>
        <li><b>ALO 170:</b> Çalışma ve Sosyal Güvenlik İletişim Merkezi; psikologlar aracılığıyla bilgilendirme ve destek.</li>
        <li><b>CİMER</b> (cimer.gov.tr)</li>
        <li><b>TBMM Dilekçe Komisyonu</b></li>
        <li><b>TİHEK</b> (tihek.gov.tr): ayrımcılık temellerine (cinsiyet, engellilik, din, sağlık durumu vb.) dayanan işyerinde yıldırma <span class="law">6701 s.K. md. 17</span>.</li>
        <li><b>Kamu Denetçiliği Kurumu</b> (ombudsman.gov.tr): kamu idareleri hakkında.</li>
        <li><b>Sendikan</b> ve ücret ödeyemiyorsan ilindeki <b>barodan adli yardım</b>.</li>
      </ul>
      <p class="src">Kaynak: 2025/3 sayılı Genelge · 6701 s.K.</p>
    </div>
  </details>
  <details class="doc">
    <summary>Suç oluşturabilecek davranışlar</summary>
    <div class="body">
      <p>Hakaret, tehdit gibi bazı davranışlar ayrıca suç oluşturabilir. Şikâyete bağlı suçlarda şikâyet süresi, fiili ve faili öğrendiğin günden itibaren <b>6 aydır</b> <span class="law">TCK md. 73</span>. Süreler sayfası her kaydın bu süresini gösterir.</p>
    </div>
  </details>
  <details class="doc">
    <summary>Destek ve sağlığın</summary>
    <div class="body">
      <p>Uzun süreli baskı uyku, kaygı ve beden sağlığını etkileyebilir. ALO 170'teki psikologlardan destek alabilir, bir hekime başvurabilirsin. Yalnız kalma: sendikan, güvendiğin bir arkadaşın ya da ailenle konuş.</p>
    </div>
  </details>
</template>

<!-- ================= İŞLEYİŞ (uygulamada ve raporun sonunda) ================= -->
<template id="tpl-isleyis">
  <h3>Uygulamanın işleyişi</h3>
  <p>MKD (Mobbing Kayıt Defteri), çalışanın işyerinde yaşadığı olayları kendi telefonunda kayıt altına alması için hazırlanmış bir uygulamadır. Kayıtların nasıl oluşturulduğu ve korunduğu aşağıda açıklanmıştır.</p>
  <ol>
    <li><b>Taslak ve kesinleştirme.</b> Kayıt yazılırken taslaktır ve değiştirilebilir. Kullanıcı "Kesinleştir ve kilitle" dediğinde kayda bir sıra numarası verilir ve kesinleşme tarihi ile saati kayda yazılır. Taslağın oluşturulduğu an da ayrıca saklanır.</li>
    <li><b>Kesinleşmiş kayıt değiştirilemez ve silinemez.</b> Uygulama arayüzü, kesinleşmiş kaydın düzenlenmesine ya da silinmesine izin vermez.</li>
    <li><b>Düzeltmeler ek kayıt olarak tutulur.</b> Kullanıcı bir hatayı düzeltmek ya da bilgi eklemek isterse bu, asıl kaydın altına kendi tarih ve saatiyle "Düzeltme" veya "Ek" olarak eklenir. Asıl metin olduğu gibi kalır.</li>
    <li><b>Silme yerine geri çekme.</b> Yanlışlıkla girilen bir kayıt silinmez; gerekçesiyle birlikte "geri çekildi" olarak işaretlenir ve raporda görünmeye devam eder.</li>
    <li><b>Kesintisiz sıra numarası.</b> Her kesin kayıt bir önceki numaranın devamını alır (MKD-0001, MKD-0002…). Numaralar yeniden kullanılmaz; numaralarda boşluk bulunmaması aradan kayıt çıkarılmadığını gösterir.</li>
    <li><b>Dış kopya.</b> Kullanıcı kesinleşen bir kaydın özetini kendisine ya da güvendiği bir kişiye e-postayla gönderebilir ve dönemsel olarak kayıtlarını "mühürleyerek" bir dosya hâlinde gönderebilir. Bu gönderimlerin tarihi uygulamanın dışında, e-posta sağlayıcısının kayıtlarında yer alır. Uygulama gönderim ekranını açtığı anı not eder; gönderimin asıl kanıtı e-postanın kendisidir.</li>
    <li><b>Saklama ve güvenlik.</b> Veriler yalnızca kullanıcının cihazında, AES-256-GCM yöntemiyle şifreli tutulur. Uygulama hiçbir sunucuya veri göndermez; geliştirici dahil hiç kimse kayıtlara erişemez. Yanlış PIN denemelerinde kayıtlar silinmez, bekleme süresi uzar ve denemeler kullanıcıya bildirilir.</li>
    <li><b>Yedekten geri yükleme</b> mevcut kayıtların üzerine yazmaz; yalnızca eksik kayıtları ekler. Farklı bir defterin yedeği numara çakışmasına yol açacaksa birleştirmeyi reddeder.</li>
  </ol>
  <p><b>Sınırlar.</b> Uygulama, kayıtların arayüz üzerinden değiştirilmesini engeller. Ancak telefonun veri deposuna teknik araçlarla doğrudan müdahale edilmesini ya da cihaz saatinin değiştirilmesini tamamen engelleyemez. Bu nedenle kayıtların zamanına ilişkin en güçlü dayanak, uygulama dışına gönderilmiş tarihli kopyalardır (e-posta, KEP). Kayıtlar kullanıcının kendi beyanıdır ve tanık, belge gibi diğer delillerle birlikte değerlendirilmelidir.</p>
</template>

<!-- ================= KVKK ================= -->
<template id="tpl-kvkk">
  <p class="note">6698 sayılı Kişisel Verilerin Korunması Kanunu çerçevesinde hazırlanmıştır. Son güncelleme: Kasım 2026.</p>
  <details class="doc" open><summary>1. Hangi veriler işlenir?</summary><div class="body">
    <p>Yalnızca senin girdiğin bilgiler: olayların tarihi, yeri ve anlatımı; olaylarla ilgili kişilerin adı, unvanı, söz ve davranışları; tanık adları; belgeler ve fotoğraflar; başvuru bilgileri; profil bilgilerin (ad, unvan, kurum); kurtarma sorun ve cevabın.</p>
    <p>"Sağlığına etkisi" alanına yazdıkların KVKK md. 6 uyarınca <b>özel nitelikli kişisel veri</b> sayılabilir. Bu alan isteğe bağlıdır; rapora eklenip eklenmeyeceğini sen seçersin.</p>
  </div></details>
  <details class="doc"><summary>2. Veriler nerede tutulur?</summary><div class="body">
    <p>Tüm veriler <b>yalnızca bu cihazda</b>, <b>AES-256-GCM</b> yöntemiyle şifreli tutulur. Şifre anahtarı PIN'inden ve kurtarma cevabından türetilen anahtarlarla korunur; PIN ve cevap hiçbir yere kaydedilmez. Uygulama hiçbir sunucuya veri göndermez; reklam, analiz ya da takip kodu yoktur. Uygulamayı yayınlayan kişi dahil hiç kimse verilerine erişemez.</p>
    <p>Kurtarma sorusunun kendisi, giriş ekranında gösterilebilmesi için şifresiz saklanır. Soruya kişisel bilgi yazma.</p>
    <p>Veriler cihazdan ancak senin işleminle çıkar: yedek alman, rapor ya da dilekçe paylaşman, bir kaydı e-postayla göndermen.</p>
  </div></details>
  <details class="doc"><summary>3. E-postayla gönderim</summary><div class="body">
    <p>"Kendime gönder" ve "Mühürle" işlemlerinde kayıt özeti, senin seçtiğin e-posta uygulaması aracılığıyla gönderilir. Bu durumda veri, kullandığın e-posta sağlayıcısının sunucularında saklanır; bazı sağlayıcıların sunucuları yurt dışındadır. Bu gönderimi yapıp yapmamak tamamen senin kararındır.</p>
  </div></details>
  <details class="doc"><summary>4. Hukuki çerçeve</summary><div class="body">
    <ul>
      <li><b>Kişisel kullanım istisnası:</b> KVKK md. 28/1-a'ya göre kişisel verilerin üçüncü kişilere verilmemek ve veri güvenliğine ilişkin yükümlülüklere uyulmak kaydıyla, gerçek kişiler tarafından tamamen kendisiyle ilgili faaliyetler kapsamında işlenmesine Kanun uygulanmaz.</li>
      <li><b>Paylaştığında:</b> Raporu bir kuruma, avukata veya mahkemeye verdiğinde KVKK md. 5/2-e'deki "bir hakkın tesisi, kullanılması veya korunması için veri işlemenin zorunlu olması" hukuki sebebi gündeme gelebilir.</li>
      <li><b>Özel nitelikli veriler</b> KVKK md. 6 kapsamında daha sıkı korunur (7499 s.K. ile 2024 değişikliği).</li>
      <li><b>Veri güvenliği:</b> KVKK md. 12'deki teknik tedbirler: şifreleme, PIN kilidi, otomatik kilit, gizlilik perdesi.</li>
    </ul>
  </div></details>
  <details class="doc"><summary>5. Senin sorumlulukların</summary><div class="body">
    <ul>
      <li>Raporu ve dilekçeleri yalnızca <b>yetkili mercilere</b>, avukatına ya da sendikana ver.</li>
      <li>Kayıtları <b>sosyal medyada ya da gruplarda paylaşma.</b> Kişilik hakları, hakaret ve kişisel veri ihlali riskleri doğurabilir.</li>
      <li>Olayla ilgisi olmayan kişisel bilgileri yazma (KVKK md. 4: amaçla bağlantılı, sınırlı ve ölçülü).</li>
      <li>Hasta adı, TC kimlik numarası gibi üçüncü kişi bilgisi içeren görüntüleri eklemeden önce o kısmı kapat.</li>
      <li>Tanıkların bilgilerini paylaşmadan önce onlarla konuş.</li>
      <li>PIN'ini ve kurtarma cevabını kimseyle paylaşma, düzenli yedek al.</li>
    </ul>
  </div></details>
